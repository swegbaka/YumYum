services:
  - type: web
    name: yumyum
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.cjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_DB
        value: yumyum
      - key: MONGODB_URI
        sync: false
